[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shooty"
version = "0.1.0"
description = "A small screenshot annotation tool"
requires-python = ">=3.10"
dependencies = ["Pillow>=9"]

[project.scripts]
shooty = "shooty.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
